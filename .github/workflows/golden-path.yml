name: Real golden-path build tests

# These tests fetch a real commit archive from codeload.github.com (no auth
# support, and not the same endpoint/limit as the GitHub REST API) and run a
# real `npm ci` / build against it (tests/realStaticHtmlGoldenPath.test.ts
# and tests/realViteReactGoldenPath.test.ts). They depend on two external
# services being reachable and are slower than the rest of the suite, so
# this runs on a schedule and on demand instead of on every push/PR.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          PEEPHOLE_REAL_NETWORK_TESTS: "1"
